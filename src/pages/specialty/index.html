<scroll-view
  scroll-y
  type="custom"
  style="width: 100vw; height: 100vh"
  TODO-refresher-enabled="{{true}}"
  refresh-triggered="{{refreshTriggered}}"
  refresher-threshold="{{100}}"
  bindrefresherpulling="onPulling"
  bindrefresherrefresh="onRefresh"
  bindrefresherrestore="onRestore"
  bindrefresherabort="onAbort"
>
  <sticky-section push-pinned-header="{{true}}">
    <sticky-header>
      <app-bar title="特产 🫐">
        <!-- TODO search -->
        <!-- <view slot="extend">
          <view style="padding: 8px 8px 12px">
            <view
              style=" display: flex; flex-direction: row; align-items: center; padding: 8px; background-color: #8888884f; opacity: 0.8; border-radius: 4px; "
            >
              <icon type="search" size="20" style="margin-right: 8px"></icon>
              <input
                class="weui-input"
                style="flex: 1"
                maxlength="80"
                placeholder="搜索"
              />
            </view>
          </view>
        </view> -->
      </app-bar>
    </sticky-header>

    <grid-view main-axis-gap="8" cross-axis-gap="8" column-count="2" padding="{{[8, 8, 8, 8]}}">
      <view wx:for="{{specialties}}" wx:key="id">
        <view class="face" style="border-radius: 4px; overflow: hidden; display: flex; flex-direction: column" data-specialty-id="{{item.id}}" bindtap="onClickSpecialty">
          <!-- aspect 1/1 from https://developers.weixin.qq.com/community/develop/doc/000c425a2186985458d17fe0861000 -->
          <view style="width: 100%; height: 0; padding-bottom: 100%; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden">
            <image src="{{item._images[0]}}" fade-in="{{true}}" mode="aspectFill" style="width: 100%; flex: 1; aspect-ratio: 1/1; margin-top: 100%"></image>
          </view>

          <view style="padding: 4px; flex: 1; width: calc(100% - 4px * 2); height: 64px; overflow: hidden; position: relative">
            <view class="text-main" style="font-size: 1rem">{{item.name}}</view>
            <view class="text-highlight">{{item.highlight}}</view>
            <rich-text class="text-desc" nodes="{{item.description}}"></rich-text>
            <view class="linear-glass" style="position: absolute; bottom: -1px; left: 0; right: 0; height: 1.5rem"></view>
          </view>
        </view>
      </view>
    </grid-view>
  </sticky-section>

  <view style="height: 64px"></view>
  <view class="tab-bar-height"></view>
</scroll-view>

<view wx:if="{{flags.privateInfusion}}" style="position: absolute; bottom: 0; left: 0; right: 0">
  <view wx:if="{{!isSinglePage}}">
    <view wx:if="{{!isSinglePage}}" class="glass" style="height: 64px; display: flex; flex-direction: row; justify-content: center; align-items: center; padding: 0 8px">
      <button open-type="share" style="width: auto; margin-right: 8px">转发分享</button>
      <button type="primary" style="flex: 1" bindtap="onContact">我要下单</button>
    </view>
    <view class="tab-bar-height"></view>
  </view>

  <view wx:if="{{isSinglePage}}" class="glass" style="display: flex; flex-direction: row; justify-content: flex-end; align-items: center; padding: 16px 8px">
    <view style="font-size: 1.5rem">下单，请点击下方继续👇</view>
  </view>
</view>
